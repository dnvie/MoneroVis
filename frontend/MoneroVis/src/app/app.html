@if (isBackendDown()) {
<div class="unavailableLayout">
  <app-unavailable></app-unavailable>
  <app-footer></app-footer>
</div>
} @else {
@if (showSearchBar()) {
<app-search-bar></app-search-bar>
}
<app-sidebar></app-sidebar>

</div>
<app-footer></app-footer>
}
