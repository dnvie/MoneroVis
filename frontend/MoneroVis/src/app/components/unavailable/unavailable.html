<div class="unavailableFrame">
  <div class="unavailableContainer">
    <h1 class="unavailableHeading">MoneroVis is currently not available</h1>
    <p class="unavailableSubheading">
      Unable to connect to the backend. Please check back later.
    </p>
    <p class="unavailableNotice">
      As this service is voluntarily hosted for the community, uptime cannot be guaranteed.
      For optimal privacy and performance, users are encouraged to host their own instance of MoneroVis.
    </p>

    <div class="actionButtons">
      <button class="retryButton" (click)="retry()" [disabled]="isSpinning()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="18px"
          viewBox="0 -960 960 960"
          width="18px"
          fill="currentColor"
          class="retryIcon"
          [class.spinning]="isSpinning()"
        >
          <path
            d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"
          />
        </svg>
        <span>Check connection</span>
      </button>

      <a
        href="https://www.github.com/dnvie/MoneroVis"
        target="_blank"
        rel="noopener"
        class="githubButton"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="18px"
          viewBox="0 0 24 24"
          width="18px"
          fill="currentColor"
        >
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
          />

        <span>GitHub</span>
      </a>
    </div>
  </div>
</div>
